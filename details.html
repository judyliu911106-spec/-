<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老公請查帳 - 明細歷史</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- 🌸 手機桌面高顏值淺粉紅專屬圖示 -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='url(%23bg)'/><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23fff0f3'/><stop offset='100%' stop-color='%23ffb6c1'/></linearGradient><filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'><feDropShadow dx='0' dy='4' stdDeviation='4' flood-color='%23ff1493' flood-opacity='0.15'/></filter></defs><g filter='url(%23shadow)' stroke='%23ff1493' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='%23ff69b4'><path d='M90,95 C75,80 40,75 45,95 C50,115 80,100 90,95 Z'/><path d='M90,95 C105,80 140,75 135,95 C130,115 100,100 90,95 Z'/><path d='M85,95 C80,120 70,140 60,145 M95,95 C100,120 110,140 120,145' stroke='%23ff1493' stroke-width='5' fill='none'/><circle cx='90' cy='95' r='10' fill='%23ff1493'/></g><path d='M135,45 L138,55 L148,58 L138,61 L135,71 L132,61 L122,58 L132,55 Z' fill='%23fff' opacity='0.9'/><path d='M48,125 L50,132 L57,134 L50,136 L48,143 L46,136 L39,134 L46,132 Z' fill='%23fff' opacity='0.8'/></svg>">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="老公請查帳">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffe4e1 !important; margin: 0; padding: 8px; box-sizing: border-box; }
        .app-shell { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 60px; min-height: calc(100vh - 20px); }
        .glass-panel { background: rgba(255, 255, 255, 0.7) !important; border-radius: 20px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .grow-panel { flex-grow: 1; display: flex; flex-direction: column; }
        .text-center { text-align: center; }
        .total-amount { font-size: 26px; font-weight: bold; color: #ff1493; margin-top: 3px; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .filter-row input, .filter-row select { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #ffb6c1; background: #fff; font-size: 14px; outline: none; }
        .record-list { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: calc(100vh - 220px); }
        .record-card { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .record-info { display: flex; flex-direction: column; gap: 2px; }
        .record-title { font-weight: bold; color: #333; font-size: 14px; }
        .record-meta { font-size: 12px; color: #888; }
        .record-amount { font-weight: bold; color: #ff1493; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .delete-btn { background: #ffe4e1; color: #ff1493; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .delete-btn:active { background: #ffb6c1; color: #fff; }
        .loading-text { text-align: center; color: #ff69b4; font-weight: bold; padding: 20px 0; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ffedf0; z-index: 1000; }
        .nav-item { text-decoration: none; color: #888; font-size: 14px; width: 50%; text-align: center; line-height: 50px; }
        .nav-item.active { color: #ff1493; font-weight: bold; background: #fff0f5; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="glass-panel text-center">
            <div style="font-size:14px; color:#666; font-weight:bold;">🔍 篩選花費總計</div>
            <div class="total-amount">NT$ <span id="filter-total">0</span></div>
        </div>

        <div class="glass-panel grow-panel">
            <div class="filter-row">
                <input type="month" id="filter-month" onchange="renderRecords()">
                <select id="filter-category" onchange="renderRecords()">
                    <option value="all">所有分類</option>
                    <option value="主食">🍱 主食</option>
                    <option value="點心">🍰 點心</option>
                    <option value="住宿">🎀 住宿</option>
                    <option value="交通">🚗 交通</option>
                    <option value="購物">🛍️ 購物</option>
                    <option value="治裝">👗 治裝</option>
                    <option value="電話及會員">📱 電話會員</option>
                    <option value="醫療">🏥 醫療</option>
                    <option value="保養美體">💅 保養美體</option>
                    <option value="儲值及娛樂">🎮 娛樂儲值</option>
                    <option value="狗勾">🐶 狗勾</option>
                    <option value="其他">✨ 其他</option>
                </select>
            </div>

            <div id="loading-indicator" class="loading-text">正在更新資料中...🌸</div>
            <div class="record-list" id="record-container" style="display: none;"></div>
        </div>
        
        <div class="nav-bar">
            <a href="index.html" class="nav-item">記帳首頁</a>
            <a href="details.html" class="nav-item active">明細歷史</a>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbysT5brkEOmCNvDw_LWeesJlDLr-W_jH9DzK2itaa_6oeMdq27w0_rHvUfD_t0QTyW8/exec"; 
        let allRecords = [];

        window.addEventListener('load', () => {
            let today = new Date();
            document.getElementById('filter-month').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            
            fetch(`${GAS_URL}?action=getData`)
                .then(res => res.json()).then(data => {
                    if (data && data.records) {
                        allRecords = data.records.filter(r => r.date && !r.date.toString().includes("#NUM!") && !(r.amount && r.amount.toString().includes("#NUM!")));
                    }
                    document.getElementById('loading-indicator').style.display = 'none';
                    document.getElementById('record-container').style.display = 'flex';
                    renderRecords();
                }).catch(() => { document.getElementById('loading-indicator').innerText = "讀取資料失敗 🌸"; });
        });

        function renderRecords() {
            const targetMonth = document.getElementById('filter-month').value; 
            const targetCat = document.getElementById('filter-category').value;
            const container = document.getElementById('record-container');
            container.innerHTML = "";
            let total = 0;

            [...allRecords].reverse().forEach(r => {
                if (r.date.substring(0, 7) === targetMonth && (targetCat === 'all' || r.category === targetCat)) {
                    let amt = Number(r.amount) || 0; total += amt;
                    let card = document.createElement('div'); card.className = 'record-card';
                    let dateObj = new Date(r.date);
                    card.innerHTML = `<div class="record-info"><div class="record-title">${r.category}${r.item?` (${r.item})`:''}</div><div class="record-meta">${String(dateObj.getMonth()+1).padStart(2,'0')}/${String(dateObj.getDate()).padStart(2,'0')}</div></div><div class="record-amount">$${amt.toLocaleString()}<button class="delete-btn" onclick="deleteRecord(${r.rowId}, '${r.date}', ${amt})">刪除</button></div>`;
                    container.appendChild(card);
                }
            });
            document.getElementById('filter-total').innerText = total.toLocaleString();
            if(container.children.length === 0) container.innerHTML = '<div style="text-align:center; color:#999; padding:20px; font-size:14px;">本月這個分類沒有紀錄唷！✨</div>';
        }

        function deleteRecord(rowId, date, amount) {
            if (!confirm("確定要刪除這筆紀錄嗎？🌸")) return;
            fetch(`${GAS_URL}?action=deleteRecord&rowId=${rowId}&date=${date}&amount=${amount}`).then(res => res.json()).then(res => { alert(res.message); if(res.status === "success") location.reload(); });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夢幻粉紅記帳</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffe4e1; margin: 0; padding: 8px; box-sizing: border-box; }
        .app-shell { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 60px; min-height: calc(100vh - 70px); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); border-radius: 20px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .text-center { text-align: center; }
        .total-amount { font-size: 26px; font-weight: bold; color: #ff1493; margin-top: 3px; }
        .budget-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .budget-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 6px 10px; border-radius: 10px; }
        .budget-item input { width: 70px; text-align: right; border: none; background: transparent; font-weight: bold; color: #ff1493; }
        .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-row input { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #ffb6c1; }
        .category-container { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .cat-btn { padding: 6px 12px; background: #fff; border-radius: 12px; cursor: pointer; display: inline-block; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .cat-btn.selected { background: #ffb6c1; color: #fff; font-weight: bold; transform: scale(1.03); }
        .amount-display { margin: 8px 0; text-align: center; font-size: 13px; background: #fff; padding: 5px; border-radius: 10px; }
        
        .keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .key { background: #fff; padding: 12px; text-align: center; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.1s ease; }
        .key:active { background: #ffebf0; transform: scale(0.95); }
        
        .submit-btn { 
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%); 
            color: white; 
            grid-column: span 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px;
            box-shadow: 0 3px 6px rgba(255, 105, 180, 0.3);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .submit-btn:active { 
            background: linear-gradient(135deg, #ffa1b2 0%, #ff52a3 100%);
            transform: scale(0.90) translateY(2px); 
            box-shadow: 0 1px 3px rgba(255, 105, 180, 0.2);
        }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ffedf0; z-index: 1000; }
        .nav-item { text-decoration: none; color: #888; font-size: 14px; width: 50%; text-align: center; line-height: 50px; }
        .nav-item.active { color: #ff1493; font-weight: bold; background: #fff0f5; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="glass-panel text-center">
            <div style="font-size:18px;">🌸</div>
            <div style="font-size:13px; color:#666; font-weight:bold;">本月累積花費</div>
            <div class="total-amount">NT$ <span id="month-total">0</span></div>
        </div>

        <div class="glass-panel">
            <div style="font-size:13px; font-weight:bold; margin-bottom:6px; color:#555;">🎀 預算餘額分配</div>
            <div class="budget-grid">
                <div class="budget-item"><span>存錢</span><input type="number" id="bg-save" onchange="updateBudget('save', this.value)"></div>
                <div class="budget-item"><span>可花費</span><input type="number" id="bg-spend" onchange="updateBudget('spend', this.value)"></div>
                <div class="budget-item"><span>美妝</span><input type="number" id="bg-makeup" onchange="updateBudget('makeup', this.value)"></div>
                <div class="budget-item"><span>運動</span><input type="number" id="bg-sport" onchange="updateBudget('sport', this.value)"></div>
                <div class="budget-item"><span>旅遊</span><input type="number" id="bg-travel" onchange="updateBudget('travel', this.value)"></div>
                <div class="budget-item"><span>保險</span><input type="number" id="bg-insurance" onchange="updateBudget('insurance', this.value)"></div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="input-row">
                <input type="date" id="tx-date">
                <input type="text" id="tx-item" placeholder="項目內容 (選填)">
            </div>
            
            <div class="category-container" id="cat-container">
                <div class="cat-btn" onclick="selectCat(this, '主食')">🍱 主食</div>
                <div class="cat-btn" onclick="selectCat(this, '點心')">🍰 點心</div>
                <div class="cat-btn" onclick="selectCat(this, '住宿')">🎀 住宿</div>
                <div class="cat-btn" onclick="selectCat(this, '交通')">🚗 交通</div>
                <div class="cat-btn" onclick="selectCat(this, '購物')">🛍️ 購物</div>
                <div class="cat-btn" onclick="selectCat(this, '治裝')">👗 治裝</div>
                <div class="cat-btn" onclick="selectCat(this, '電話及會員')">📱 電話會員</div>
                <div class="cat-btn" onclick="selectCat(this, '醫療')">🏥 醫療</div>
                <div class="cat-btn" onclick="selectCat(this, '保養美體')">💅 保養美體</div>
                <div class="cat-btn" onclick="selectCat(this, '儲值及娛樂')">🎮 娛樂儲值</div>
                <div class="cat-btn" onclick="selectCat(this, '狗勾')">🐶 狗勾</div>
                <div class="cat-btn" onclick="selectCat(this, '其他')">✨ 其他</div>
            </div>

            <div class="amount-display">
                已選: <span id="selected-cat-text" style="color:#ff1493; font-weight:bold;">未選擇</span> | 
                金額: <span style="color:#ff1493; font-weight:bold;">$</span><span id="tx-amount" style="color:#ff1493; font-weight:bold;">0</span>
            </div>
            
            <div class="keyboard">
                <div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div>
                <div class="key" style="color:#cc0000;" onclick="pressKey('C')">⌫</div><div class="key" onclick="pressKey('0')">0</div>
                <div class="key submit-btn" onclick="submitRecord()">送出✨</div>
            </div>
        </div>
        
        <div class="nav-bar">
            <a href="index.html" class="nav-item active">記帳首頁</a>
            <a href="details.html" class="nav-item">明細歷史</a>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbysT5brkEOmCNvDw_LWeesJlDLr-W_jH9DzK2itaa_6oeMdq27w0_rHvUfD_t0QTyW8/exec"; 
        let currentAmount = "0";
        let chosenCategory = "";

        function triggerVibration(type = "light") {
            try { if (window.navigator && window.navigator.vibrate) { if (type === "light") window.navigator.vibrate(15); else if (type === "success") window.navigator.vibrate([40, 40, 40]); } } catch (e) {}
        }

        window.addEventListener('load', () => {
            document.getElementById('tx-date').valueAsDate = new Date();
            const fields = ['save', 'spend', 'makeup', 'sport', 'insurance'];
            fields.forEach(f => { if(localStorage.getItem('budget_'+f)) document.getElementById('bg-'+f).value = localStorage.getItem('budget_'+f); });
            
            fetch(`${GAS_URL}?action=getData`)
                .then(res => res.json())
                .then(data => {
                    let today = new Date();
                    let currentYearMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                    let total = 0;
                    if (data && data.records) {
                        total = data.records.reduce((sum, r) => {
                            if (r.date) {
                                let dateStr = r.date.toString();
                                let amtStr = r.amount ? r.amount.toString() : "0";
                                if (dateStr.includes("#NUM!") || amtStr.includes("#NUM!")) return sum;
                                if (dateStr.replace(/\//g, '-').substring(0, 7) === currentYearMonth) {
                                    let amt = Number(r.amount); return sum + (isNaN(amt) ? 0 : amt);
                                }
                            } return sum;
                        }, 0);
                    }
                    document.getElementById('month-total').innerText = total.toLocaleString();
                    if (data && data.budgets) {
                        fields.forEach(f => { if(data.budgets[f] !== undefined) { document.getElementById('bg-'+f).value = data.budgets[f]; localStorage.setItem('budget_'+f, data.budgets[f]); } });
                    }
                });
        });

        function selectCat(element, cat) { triggerVibration("light"); chosenCategory = cat; document.getElementById('selected-cat-text').innerText = cat; document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('selected')); element.classList.add('selected'); }
        function pressKey(key) { triggerVibration("light"); if (key === 'C') { currentAmount = currentAmount.length > 1 ? currentAmount.slice(0, -1) : "0"; } else { currentAmount = currentAmount === "0" ? key : currentAmount + key; } document.getElementById('tx-amount').innerText = Number(currentAmount).toLocaleString(); }
        function updateBudget(cat, val) { fetch(`${GAS_URL}?action=updateBudget&category=${cat}&amount=${Number(val)||0}`); }

        function submitRecord() {
            if (!chosenCategory || currentAmount === "0") { alert("請填妥分類與金額！"); return; }
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ date: document.getElementById('tx-date').value, category: chosenCategory, item: document.getElementById('tx-item').value, amount: Number(currentAmount) }) })
            .then(res => res.json()).then(res => { triggerVibration("success"); alert(res.message); location.reload(); });
        }
    </script>
</body>
</html>
